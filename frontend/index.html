<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 手机上强制按 1280px 的桌面布局渲染，不做响应式堆叠。
         原因：媒体查询比的是**视口宽度**，把布局视口锁成 1280px 后，
         styles.css 里那一堆 @media (max-width: …) 断点在手机上全部不会命中，
         于是原样渲染桌面版，用户双指缩放浏览。
         （只给 body/#root 加 min-width 是治标：元素被撑开了，但媒体查询照旧命中。）
         刻意不加 user-scalable=no，保留双指缩放。 -->
    <meta name="viewport" content="width=1280" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23b33a2b'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23fbf7ec' font-family='serif'%3E%E7%A0%94%3C/text%3E%3C/svg%3E" />
    <title>研究生管理系统</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
