      <style>
        .a-bob{animation:a-bob 4s ease-in-out infinite}
        @keyframes a-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
        .a-ring1{transform-box:fill-box;transform-origin:center;animation:a-spin 22s linear infinite}
        .a-ring2{transform-box:fill-box;transform-origin:center;animation:a-spinr 16s linear infinite}
        .a-ring3{transform-box:fill-box;transform-origin:center;animation:a-spin 30s linear infinite}
        @keyframes a-spin{to{transform:rotate(360deg)}}
        @keyframes a-spinr{to{transform:rotate(-360deg)}}
        .a-breathe{transform-box:fill-box;transform-origin:center;animation:a-breathe 3.6s ease-in-out infinite}
        @keyframes a-breathe{0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
        .a-ribbon-l{transform-box:fill-box;transform-origin:top right;animation:a-rib 3s ease-in-out infinite}
        .a-ribbon-r{transform-box:fill-box;transform-origin:top left;animation:a-rib 3s ease-in-out infinite .5s}
        @keyframes a-rib{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
        .a-cloud{animation:a-cloud 5s ease-in-out infinite alternate}
        @keyframes a-cloud{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
        .a-rise1{animation:a-rise 3.6s linear infinite}
        .a-rise2{animation:a-rise 3.6s linear infinite 1.2s}
        .a-rise3{animation:a-rise 3.6s linear infinite 2.4s}
        @keyframes a-rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(-150px);opacity:0}}
        .a-phoenix{stroke-dasharray:14 10;animation:a-flow 2.6s linear infinite}
        @keyframes a-flow{to{stroke-dashoffset:-48}}
        .a-pillar{animation:a-shimmer 4s ease-in-out infinite}
        @keyframes a-shimmer{0%,100%{opacity:.55}50%{opacity:.9}}
      </style>
