        .o-ahoge{transform-box:fill-box;transform-origin:bottom center;animation:o-ahoge 2s ease-in-out infinite}
        @keyframes o-ahoge{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
