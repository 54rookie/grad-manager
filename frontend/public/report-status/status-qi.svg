      <style>
        .q-shiver{animation:q-shiver .6s ease-in-out infinite}
        @keyframes q-shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-.8px)}75%{transform:translateX(.8px)}}
        .q-sweat{animation:q-sweat 2.4s ease-in infinite}
        @keyframes q-sweat{0%{transform:translateY(0);opacity:0}15%{opacity:1}75%{transform:translateY(15px);opacity:1}100%{transform:translateY(21px);opacity:0}}
        .q-aura{transform-box:fill-box;transform-origin:center;animation:q-aura 2.8s ease-in-out infinite}
        @keyframes q-aura{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.07)}}
        .q-fly1{animation:q-fly1 4s ease-in-out infinite alternate}
        .q-fly2{animation:q-fly2 5s ease-in-out infinite alternate}
        @keyframes q-fly1{from{transform:translate(0,0)}to{transform:translate(10px,-13px)}}
        @keyframes q-fly2{from{transform:translate(0,0)}to{transform:translate(-11px,-8px)}}
        .q-sprout{transform-box:fill-box;transform-origin:bottom center;animation:q-sprout 2.2s ease-in-out infinite}
        @keyframes q-sprout{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
      </style>
    </defs>

