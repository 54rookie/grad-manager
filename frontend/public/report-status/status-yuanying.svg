        .y-spin-k{transform-box:fill-box;transform-origin:center;animation:y-spin 10s linear infinite;filter:drop-shadow(0 0 2.5px #9ec9f5)}
        .y-spin-r{transform-box:fill-box;transform-origin:center;animation:y-spinr 34s linear infinite}
        @keyframes y-spin{to{transform:rotate(360deg)}}
        @keyframes y-spinr{to{transform:rotate(-360deg)}}
        .y-hex{transform-box:fill-box;transform-origin:center;animation:y-spin 16s linear infinite}
        .y-hex2{transform-box:fill-box;transform-origin:center;animation:y-spinr 24s linear infinite}
        .y-glowdisk{transform-box:fill-box;transform-origin:center;animation:y-breathe 3.2s ease-in-out infinite}
        .y-breathe{transform-box:fill-box;transform-origin:center;animation:y-breathe 3.2s ease-in-out infinite}
        @keyframes y-breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.06)}}
        .y-tail{transform-box:fill-box;transform-origin:top center;animation:y-tail 2.6s ease-in-out infinite}
        @keyframes y-tail{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
      </style>
